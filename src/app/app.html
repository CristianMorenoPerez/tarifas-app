<router-outlet />
<p-toast position="top-center" key="tr" [baseZIndex]="5000" [preventOpenDuplicates]="true">
  <ng-template let-message pTemplate="message">
    <div class="flex flex-col items-start" style="flex: 1">
      <div class="flex items-center gap-2">
        <span [class]="message.icon"></span>
        <span class="font-bold text-sm">
          {{ message.summary }}
        </span>
      </div>
      <div class="font-medium text-xs my-3 text-900 text-gray-900">
        {{ message.detail }}
      </div>
    </div>
  </ng-template>
</p-toast>

<p-confirmDialog #cd>
  <ng-template pTemplate="headless" let-message>
    <div class="flex flex-col items-center rounded-md p-8 w-140 py-8">
      <div
        class="border-circle bg-white inline-flex justify-content-center align-items-center h-6rem w-6rem"
      >
        <i class="pi pi-question text-5xl"></i>
      </div>
      <span class="font-bold font-poppins text-calypso-950 text-2xl">
        {{ message.header }}
      </span>
      <div class="py-5">
        <p class="font-poppins font-normal text-calypso-950 text-lg text-center">
          {{ message.message }}
        </p>
      </div>
      <div class="flex flex-col xl:flex-row justify-center gap-4 w-full">
        <button pButton label="No" class="btn btn_primary-outline" (click)="cd.onReject()"></button>
        <button pButton label="Sí" class="btn btn_primary" (click)="cd.onAccept()"></button>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>
